<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="t3">
  <title id="t3">Delivery van with fuel drums and a balance card</title>
  <defs>
    <filter id="s3" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#304e02" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="600" height="420" rx="28" fill="#f2ffdc"/>
  <circle cx="500" cy="90" r="70" fill="#d9f7a6" opacity="0.7"/>

  <!-- Road -->
  <rect x="0" y="330" width="600" height="90" fill="#d9f7a6"/>
  <line x1="40" y1="375" x2="200" y2="375" stroke="#ffffff" stroke-width="6" stroke-dasharray="26 18"/>
  <line x1="260" y1="375" x2="420" y2="375" stroke="#ffffff" stroke-width="6" stroke-dasharray="26 18"/>

  <!-- Van cargo box -->
  <rect x="90" y="150" width="270" height="150" rx="16" fill="#80c40b"/>
  <rect x="110" y="172" width="230" height="22" rx="8" fill="#649a06" opacity="0.5"/>
  <text x="225" y="250" text-anchor="middle" font-family="Figtree, Arial, sans-serif" font-size="26" font-weight="800" fill="#ffffff">VAN SALES</text>
  <text x="225" y="275" text-anchor="middle" font-family="Figtree, Arial, sans-serif" font-size="13" font-weight="600" fill="#f2ffdc">Outdoor delivery</text>

  <!-- Cab -->
  <path d="M360 190 L430 190 Q 462 190 476 226 L 500 276 L 500 300 L 360 300 Z" fill="#304e02"/>
  <path d="M378 206 L424 206 Q 440 206 448 224 L 384 224 Z" fill="#f2ffdc"/>
  <rect x="470" y="262" width="26" height="14" rx="5" fill="#ffe27a"/>

  <!-- Flame logo mark on cab -->
  <path d="M410 288 C 400 276, 418 270, 412 254 C 428 268, 430 276, 424 288 Z" fill="#ff6600"/>

  <!-- Wheels -->
  <circle cx="160" cy="312" r="30" fill="#1f2a12"/>
  <circle cx="160" cy="312" r="12" fill="#d1d5db"/>
  <circle cx="430" cy="312" r="30" fill="#1f2a12"/>
  <circle cx="430" cy="312" r="12" fill="#d1d5db"/>

  <!-- Fuel drums -->
  <rect x="60" y="270" width="24" height="46" rx="6" fill="#e67203"/>
  <rect x="62" y="282" width="20" height="4" fill="#fff1e3"/>

  <!-- Balance card -->
  <rect x="62" y="48" width="330" height="82" rx="18" fill="#ffffff" filter="url(#s3)"/>
  <text x="88" y="82" font-family="Figtree, Arial, sans-serif" font-size="13" font-weight="600" fill="#497303">Van balance (AGO)</text>
  <text x="88" y="114" font-family="Figtree, Arial, sans-serif" font-size="26" font-weight="800" fill="#1f2a12">1,850 L</text>
  <rect x="236" y="92" width="136" height="24" rx="12" fill="#f2ffdc"/>
  <text x="304" y="108" text-anchor="middle" font-family="Figtree, Arial, sans-serif" font-size="12" font-weight="700" fill="#304e02">Outstanding: ₦ 0</text>
</svg>
